spring:
  application:
    name: portal-services
  datasource:
    url: jdbc:postgresql://localhost:5432/travel_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      uri: mongodb://admin:admin@localhost:27017/travel_mongo_db?authSource=admin

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin